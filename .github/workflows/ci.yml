name: CI

# Tests for pull requests and feature branches. Pushes to main are tested by deploy.yml
# before they ship. This workflow has no access to deploy secrets.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath ./...
      - name: shellcheck
        run: shellcheck deploy/install.sh
      - name: healthcheck self-test
        run: python3 deploy/healthcheck.py --self-test
      - name: NU7 qualification guards
        run: python3 -m unittest discover -s deploy -p 'test_qualify_public_faucet.py'
